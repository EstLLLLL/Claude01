name: Daily Brand News

on:
  schedule:
    # Multiple slots because GitHub's scheduler is best-effort and may
    # skip/delay a run. Per-day issue de-dup keeps it to one issue/day.
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate a preview without committing or creating an issue"
        type: boolean
        default: false

concurrency:
  group: daily-brand-news
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Ark model access
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
        run: python3 ark_client.py

      - name: Fetch news
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ vars.ARK_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 fetch_news.py

      - name: Preserve fetched candidates and preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-materials-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit digest
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain news)" ]; then
            git add news
            git commit -m "news: daily digest $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No news changes to commit."
          fi
